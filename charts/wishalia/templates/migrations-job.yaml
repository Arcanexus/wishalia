{{- if not (include "wishalia.database.configured" .) }}
{{- fail "no database: keep postgresql.enabled=true, or give the DATABASE_URL of yours in externalDatabase.existingSecret or existingSecret" }}
{{- end }}
{{- /* With the built-in PostgreSQL, the API pods apply the migrations (initContainer, deployment.yaml) */}}
{{- if and .Values.migrations.enabled (not .Values.postgresql.enabled) }}
# Applies the database migrations before the new version starts. With ArgoCD, the Helm hooks
# become PreSync hooks: the sync waits for the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "wishalia.fullname" . }}-migrations
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "wishalia.selectorLabels" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "wishalia.image" (dict "root" . "component" "api") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with include "wishalia.database.env" . | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
{{- end }}
