{{- range $component, $def := include "wishalia.components" . | fromYaml }}
{{- $values := index $.Values $def.values }}
{{- if $values.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wishalia.fullname" $ }}-{{ $component }}
  labels:
    {{- include "wishalia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $values.replicas }}
  selector:
    matchLabels:
      {{- include "wishalia.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wishalia.labels" $ | nindent 8 }}
        {{- include "wishalia.selectorLabels" (dict "root" $ "component" $component) | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "wishalia.serviceAccountName" $ }}
      # No component calls the Kubernetes API
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- if and (eq $component "api") $.Values.migrations.enabled $.Values.postgresql.enabled }}
      # The built-in PostgreSQL only exists once the release is installed: each API pod applies the
      # migrations before it starts, waiting for the database (one at a time, under a lock)
      initContainers:
        - name: migrations
          image: {{ include "wishalia.image" (dict "root" $ "component" "api") | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            {{- include "wishalia.database.env" $ | trim | nindent 12 }}
          resources:
            {{- toYaml $.Values.migrations.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "wishalia.image" (dict "root" $ "component" $component) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $values.port }}
            {{- if $.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $.Values.metrics.port }}
            {{- end }}
          env:
            - name: PORT
              value: {{ $values.port | quote }}
            {{- if eq $component "web-public" }}
            # adapter-node checks the Origin of form posts against it (CSRF)
            - name: ORIGIN
              value: {{ printf "https://%s" $.Values.hosts.public | quote }}
            {{- else if eq $component "web-app" }}
            - name: ORIGIN
              value: {{ printf "https://%s" $.Values.hosts.app | quote }}
            {{- if $.Values.images.enabled }}
            # The images the owner sends (10 MB at most) go through the app's form
            - name: BODY_SIZE_LIMIT
              value: {{ $.Values.images.uploadLimit | quote }}
            {{- end }}
            {{- end }}
            {{- if has $component (list "api" "worker") }}
            {{- include "wishalia.database.env" $ | trim | nindent 12 }}
            {{- end }}
            {{- range $name, $value := $values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "wishalia.fullname" $ }}
            {{- with $.Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with $.Values.startupProbe }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.readinessProbe }}
          readinessProbe:
            httpGet: { path: {{ ternary "/readyz" "/healthz" (eq $component "api") }}, port: http }
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only
            - name: tmp
              mountPath: /tmp
            {{- if and (include "wishalia.imageVolume" $) (has $component (list "api" "worker")) }}
            # The image files (docs/images.md): written by the API and the worker
            - name: images
              mountPath: {{ include "wishalia.imageDir" $ }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and (include "wishalia.imageVolume" $) (has $component (list "api" "worker")) }}
        - name: images
          persistentVolumeClaim:
            claimName: {{ include "wishalia.imageClaim" $ }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "wishalia.affinity" (dict "root" $ "component" $component) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
