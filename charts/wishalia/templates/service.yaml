{{- range $component, $def := include "wishalia.components" . | fromYaml }}
{{- $values := index $.Values $def.values }}
{{- /* The worker serves no traffic: its Service only exists for the metrics */ -}}
{{- $http := ne $component "worker" }}
{{- if and $values.enabled (or $http $.Values.metrics.enabled) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wishalia.fullname" $ }}-{{ $component }}
  labels:
    {{- include "wishalia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    {{- include "wishalia.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    {{- if $http }}
    - name: http
      port: {{ $values.port }}
      targetPort: http
    {{- end }}
    {{- if $.Values.metrics.enabled }}
    - name: metrics
      port: {{ $.Values.metrics.port }}
      targetPort: metrics
    {{- end }}
{{- end }}
{{- end }}
