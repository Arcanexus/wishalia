{{- if .Values.networkPolicy.enabled }}
# The API only accepts traffic from the two frontends, and from the ingress controller when the API
# v1 is on (hosts.api): /manage and /public are never exposed outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wishalia.fullname" . }}-api
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wishalia.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "web-app" "web-public" }}
        - podSelector:
            matchLabels:
              {{- include "wishalia.selectorLabels" (dict "root" $ "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: http
    {{- if and .Values.hosts.api .Values.apiV1.allowFrom }}
    # The REST API v1, through the ingress controller
    - from:
        {{- toYaml .Values.apiV1.allowFrom | nindent 8 }}
      ports:
        - port: http
    {{- end }}
    {{- include "wishalia.metricsIngressRule" . | trim | nindent 4 }}
---
# The worker serves no traffic: only its own probes, which the kubelet sends and NetworkPolicies do
# not filter, and its metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wishalia.fullname" . }}-worker
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wishalia.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  {{- with include "wishalia.metricsIngressRule" . | trim }}
  ingress:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
