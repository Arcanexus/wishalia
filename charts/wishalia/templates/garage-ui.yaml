{{- $garage := .Values.images.garage }}
{{- $ui := $garage.ui }}
{{- if $ui.enabled }}
{{- if not $garage.enabled }}
{{- fail "images.garage.ui.enabled needs images.garage.enabled: the console manages the chart's Garage" }}
{{- end }}
{{- if and $ui.oidc.enabled (not $ui.host) }}
{{- fail "images.garage.ui.oidc.enabled needs images.garage.ui.host: the provider sends people back to it" }}
{{- end }}
{{- if and $ui.oidc.enabled (not (and $ui.oidc.issuer $ui.oidc.clientId)) }}
{{- fail "images.garage.ui.oidc.enabled needs images.garage.ui.oidc.issuer and clientId" }}
{{- end }}
{{- if and $ui.host (has $ui.host (list .Values.hosts.public .Values.hosts.app .Values.hosts.api)) }}
{{- fail "images.garage.ui.host must differ from the hosts of Wishalia" }}
{{- end }}
{{- $name := printf "%s-garage-ui" (include "wishalia.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $garageName := include "wishalia.garage.fullname" . }}
# Garage UI (github.com/Noooste/garage-ui): a web console for the chart's Garage (the bucket of the
# images, its keys, the node). It holds the Garage admin token: sign-in with the token itself, or
# with your OIDC provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wishalia.selectorLabels" (dict "root" . "component" "garage-ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wishalia.labels" . | nindent 8 }}
        {{- include "wishalia.selectorLabels" (dict "root" . "component" "garage-ui") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: garage-ui
          image: {{ printf "%s:%s" $ui.image.repository $ui.image.tag | quote }}
          imagePullPolicy: {{ $ui.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GARAGE_UI_SERVER_HOST
              value: "0.0.0.0"
            - name: GARAGE_UI_SERVER_PORT
              value: "8080"
            - name: GARAGE_UI_SERVER_ENVIRONMENT
              value: production
            {{- with $ui.host }}
            - name: GARAGE_UI_SERVER_ROOT_URL
              value: {{ printf "https://%s" . | quote }}
            {{- end }}
            - name: GARAGE_UI_GARAGE_ENDPOINT
              value: {{ printf "http://%s:3900" $garageName | quote }}
            - name: GARAGE_UI_GARAGE_ADMIN_ENDPOINT
              value: {{ printf "http://%s:3903" $garageName | quote }}
            - name: GARAGE_UI_GARAGE_REGION
              value: {{ .Values.images.s3.region | quote }}
            - name: GARAGE_UI_GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: GARAGE_ADMIN_TOKEN
            # Same origin only: the console calls its own host
            - name: GARAGE_UI_CORS_ENABLED
              value: "false"
            # Its signing key, made at the first start; a restart signs everyone out
            - name: GARAGE_UI_AUTH_JWT_PRIVATE_KEY_PATH
              value: /app/data/jwt-key.pem
            {{- if $ui.oidc.enabled }}
            - name: GARAGE_UI_AUTH_OIDC_ENABLED
              value: "true"
            - name: GARAGE_UI_AUTH_OIDC_PROVIDER_NAME
              value: {{ $ui.oidc.name | quote }}
            - name: GARAGE_UI_AUTH_OIDC_ISSUER_URL
              value: {{ $ui.oidc.issuer | quote }}
            - name: GARAGE_UI_AUTH_OIDC_CLIENT_ID
              value: {{ $ui.oidc.clientId | quote }}
            - name: GARAGE_UI_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: GARAGE_UI_OIDC_CLIENT_SECRET
            - name: GARAGE_UI_AUTH_OIDC_COOKIE_SECURE
              value: "true"
            {{- else }}
            # Without OIDC, the sign-in page asks for the Garage admin token
            - name: GARAGE_UI_AUTH_TOKEN_ENABLED
              value: "true"
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $ui.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-ui
spec:
  type: ClusterIP
  selector:
    {{- include "wishalia.selectorLabels" (dict "root" . "component" "garage-ui") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if $ui.host }}
---
# Its own host, with the ingress settings of the chart (ingress.className, ingress.annotations)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-ui
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ui.tlsSecretName }}
  tls:
    - secretName: {{ . }}
      hosts: [{{ $ui.host | quote }}]
  {{- end }}
  rules:
    - host: {{ $ui.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
{{- end }}
