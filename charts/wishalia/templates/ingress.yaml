{{- if .Values.ingress.enabled }}
{{- if eq .Values.hosts.public .Values.hosts.app }}
{{- fail "hosts.public and hosts.app must differ: the public view and the management app never share a host" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wishalia.fullname" . }}
  labels:
    {{- include "wishalia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host, $component := dict .Values.hosts.public "web-public" .Values.hosts.app "web-app" }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wishalia.fullname" $ }}-{{ $component }}
                port:
                  name: http
    {{- end }}
{{- end }}
