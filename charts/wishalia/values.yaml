# Default values of the wishalia chart. Every setting is documented in docs/chart-values.md.

nameOverride: ""
fullnameOverride: ""

image:
  # Each component has its own image: <registry>/<repository>-<component>:<tag>
  registry: ghcr.io
  repository: arcanexus/wishalia
  # Defaults to the appVersion of the chart
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  # Display name of the product (the code only knows the code name "wishalia")
  appName: Wishalia
  logLevel: info

# Hosts of the two frontends. The public view and the management app are never served by the
# same host (spec: separation of the public view and the management app).
hosts:
  # Public view of the share links, e.g. wishalia.example.com
  public: wishalia.example.com
  # Management app, e.g. app.wishalia.example.com
  app: app.wishalia.example.com
  # REST API v1 for scripts and home automation, e.g. api.wishalia.example.com. Empty: the API v1
  # is off. The ingress only forwards /v1 on this host.
  api: ""

# REST API v1 (personal access tokens, made in the management app). On only when hosts.api is set.
apiV1:
  # Requests per minute and per token, counted by each API replica
  rateLimit: 120
  # Who may reach the API pods on its HTTP port when networkPolicy.enabled, besides the two
  # frontends: the ingress controller. NetworkPolicy "from" peers; the default is ingress-nginx.
  allowFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

# Sign-in (Better Auth in the API). The secrets go in existingSecret: AUTH_SECRET (32+ characters),
# OIDC_CLIENT_SECRET, SMTP_URL. See docs/configuration.md.
auth:
  # Emails allowed to create their account by themselves (the owners), comma-separated. Everyone
  # else is invited.
  ownerEmails: ""
  # Parent domain of the two hosts, so that one session works on both. Defaults to hosts.public
  # when the management host is a subdomain of it; set "-" to keep the session on the app host.
  cookieDomain: ""
  # OIDC provider of the owners. The client secret goes in existingSecret (OIDC_CLIENT_SECRET).
  oidc:
    issuer: ""
    clientId: ""
    # Name on the sign-in button: "Se connecter avec <name>" (e.g. "Authentik", "Google")
    name: "SSO"
  # Sender of the magic links, e.g. "wishalia <noreply@example.com>". SMTP_URL goes in existingSecret.
  mailFrom: ""

# Secret holding the sensitive settings (S3 keys, auth secrets, and DATABASE_URL when you bring
# your own database), loaded as environment variables by every component. Create it with your secret manager (External Secrets,
# Sealed Secrets...): the chart never holds a secret value.
existingSecret: ""

# The database. Either the chart deploys its own PostgreSQL (postgresql.enabled, the default), or
# you already have one: set postgresql.enabled=false and give its DATABASE_URL, in
# externalDatabase.existingSecret or in existingSecret. See docs/installation.md.
postgresql:
  enabled: true
  # The official image (docker-library), the same major version as docker-compose.yml
  image:
    registry: docker.io
    repository: library/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: wishalia
    username: wishalia
    # Secret holding the password (key passwordKey). Empty: the chart makes one at the first install
    # and keeps it. Set it with ArgoCD or helm template, which cannot read the cluster back.
    existingSecret: ""
    passwordKey: password
  persistence:
    # Off: the data lives in the pod and is lost with it (for a trial only)
    enabled: true
    # A PersistentVolumeClaim you already have (e.g. bound to an existing volume): the chart then
    # makes none, and size, storageClass and accessModes are not used
    existingClaim: ""
    size: 5Gi
    # Empty: the cluster's default class; "-": no class
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # The postgres user of the Alpine image (uid 70)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# An existing PostgreSQL (16+), when postgresql.enabled=false: the Secret and its key holding the
# full DATABASE_URL (postgres://user:password@host:5432/database). Empty: DATABASE_URL is read from
# existingSecret.
externalDatabase:
  existingSecret: ""
  urlKey: DATABASE_URL

# Images of the items (docs/images.md): kept in an S3 bucket (MinIO), thumbnails made by imgproxy,
# which the chart deploys inside the cluster only. Off: no image, everything else works.
# existingSecret holds S3_ACCESS_KEY, S3_SECRET_KEY, IMGPROXY_KEY and IMGPROXY_SALT (hex, 32+
# characters each: openssl rand -hex 32).
images:
  enabled: false
  # Where the files live: "volume" (a PersistentVolumeClaim, created by the chart or existing) or
  # "s3" (a bucket of yours, or Garage deployed with the chart: images.garage). docs/images.md
  # compares them.
  storage: volume
  persistence:
    # An existing PersistentVolumeClaim; empty: the chart creates one (kept on helm uninstall)
    existingClaim: ""
    size: 5Gi
    # Empty: the cluster's default StorageClass
    storageClass: ""
    # ReadWriteOnce: the API, the worker and imgproxy are kept on the same node (podAffinity).
    # ReadWriteMany (NFS, CephFS...) lets them run anywhere.
    accessModes: [ReadWriteOnce]
    annotations: {}
  s3:
    # e.g. http://minio.storage.svc:9000 or https://s3.nas.example.com; empty with images.garage
    endpoint: ""
    region: us-east-1
    bucket: wishalia
  # An S3 bucket deployed with the chart: Garage (https://garagehq.deuxfleurs.fr), on one node, inside
  # the cluster only. Needs images.storage=s3 and an empty images.s3.endpoint (the chart points it
  # at Garage). existingSecret then also holds GARAGE_RPC_SECRET (openssl rand -hex 32), and the
  # bucket's key in Garage's format: S3_ACCESS_KEY="GK$(openssl rand -hex 16)" and
  # S3_SECRET_KEY="$(openssl rand -hex 32)". Garage makes the bucket and that key at its first start.
  garage:
    enabled: false
    image:
      repository: dxflrs/garage
      tag: v2.5.0
      pullPolicy: IfNotPresent
    persistence:
      # An existing PersistentVolumeClaim; empty: the chart makes one (kept on helm uninstall)
      existingClaim: ""
      size: 10Gi
      # Empty: the cluster's default StorageClass; "-": no class
      storageClass: ""
      accessModes: [ReadWriteOnce]
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }
    # Garage UI (https://github.com/Noooste/garage-ui): a web console for this Garage (browse the
    # images, the keys, the node). existingSecret then also holds GARAGE_ADMIN_TOKEN (openssl rand
    # -hex 32), Garage's administration token, which the console uses.
    ui:
      enabled: false
      image:
        repository: noooste/garage-ui
        tag: v0.14.0
        pullPolicy: IfNotPresent
      # Its own host, through the chart's ingress settings (ingress.className and annotations), e.g.
      # garage.wishalia.example.com. Empty: no ingress (kubectl port-forward on its Service, 8080).
      host: ""
      # TLS secret of that host
      tlsSecretName: ""
      # Sign-in with your OIDC provider (needs host). Off: the sign-in page asks for the admin
      # token. The client secret goes in existingSecret: GARAGE_UI_OIDC_CLIENT_SECRET. Redirect
      # URI: https://<host>/auth/oidc/callback
      oidc:
        enabled: false
        issuer: ""
        clientId: ""
        name: SSO
        # Required with OIDC: the groups whose members may sign in (any of them). Everyone else is
        # refused, even when the provider lets them through.
        allowedGroups: []
        # The claim that lists a person's groups (Authentik, Keycloak with a groups mapper: groups)
        groupsClaim: groups
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
  # Largest request of the management app (adapter-node BODY_SIZE_LIMIT): an image is 10 MB at most
  uploadLimit: 12M
  imgproxy:
    image:
      repository: ghcr.io/imgproxy/imgproxy
      tag: v4.0.25
      pullPolicy: IfNotPresent
    replicas: 1
    port: 8080
    # Largest image read, in megapixels (a decompression bomb past it)
    maxSrcResolution: 50
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    env: {}

api:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  env: {}

worker:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  env: {}

webApp:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }
  env: {}

webPublic:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }
  env: {}

# Database migrations. With an existing database: a Job before each install and upgrade (Helm hook,
# PreSync with ArgoCD). With the built-in PostgreSQL, which does not exist yet before the first
# install: a step of each API pod, before it starts (initContainer).
migrations:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  # TLS secrets: one per host, or a wildcard secret for both
  tls: []
  #  - secretName: wishalia-tls
  #    hosts: [wishalia.example.com, app.wishalia.example.com, api.wishalia.example.com]

# The API is internal: only the two frontends call it (server side). Only the frontends are exposed,
# and the API v1 when hosts.api is set (apiV1.allowFrom).
networkPolicy:
  enabled: true

# Prometheus metrics: every component serves /metrics on its own port, published by its Service
# (named "metrics") and never by the ingress. No metric describes contributions (anti-spoil).
metrics:
  enabled: true
  port: 9464
  # Who may scrape the metrics port when networkPolicy.enabled: NetworkPolicy "from" peers. The
  # default lets every pod of the "monitoring" namespace in (kube-prometheus-stack).
  allowFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # A ServiceMonitor for the Prometheus Operator (needs its CRDs)
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. release: kube-prometheus-stack, so that Prometheus selects it
    labels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# For volume drivers that do not apply fsGroup (NFS through csi-driver-nfs without fsGroupPolicy,
# hostPath...), where a fresh volume belongs to root and the non-root pods cannot write to it: an
# init container gives the root folder of each volume the chart mounts read-write (PostgreSQL, the
# image files, Garage) to the user of its pod. It runs as root with the CHOWN capability only,
# changes nothing when the owner is right, and never walks the files below. The NFS export must
# let root change an owner (no root squash).
volumePermissions:
  enabled: false
  image:
    registry: docker.io
    repository: library/busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 32Mi }

# Probes on /healthz (the httpGet part is set by the chart)
startupProbe:
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  periodSeconds: 20
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
