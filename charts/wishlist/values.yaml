# Default values of the wishlist chart. Every setting is documented in docs/chart-values.md.

nameOverride: ""
fullnameOverride: ""

image:
  # Each component has its own image: <registry>/<repository>-<component>:<tag>
  registry: ghcr.io
  repository: arcanexus/wishlist
  # Defaults to the appVersion of the chart
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

config:
  # Display name of the product (the code only knows the code name "wishlist")
  appName: wishlist
  logLevel: info

# Hosts of the two frontends. The public view and the management app are never served by the
# same host (spec: separation of the public view and the management app).
hosts:
  # Public view of the share links, e.g. wishlist.example.com
  public: wishlist.example.com
  # Management app, e.g. app.wishlist.example.com
  app: app.wishlist.example.com

# Secret holding the sensitive settings (DATABASE_URL, S3 keys, auth secrets...), loaded as
# environment variables by every component. Create it with your secret manager (External Secrets,
# Sealed Secrets...): the chart never holds a secret value.
existingSecret: ""

api:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  env: {}

worker:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  env: {}

webApp:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }
  env: {}

webPublic:
  enabled: true
  replicas: 1
  port: 3000
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { memory: 192Mi }
  env: {}

# Database migrations, run by a Job before each install and upgrade (Helm hook). Enabled once the
# data model ships its first migration.
migrations:
  enabled: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  # TLS secrets: one per host, or a wildcard secret for both
  tls: []
  #  - secretName: wishlist-tls
  #    hosts: [wishlist.example.com, app.wishlist.example.com]

# The API is internal: only the two frontends call it (server side). Only the frontends are exposed.
networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Probes on /healthz (the httpGet part is set by the chart)
startupProbe:
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  periodSeconds: 20
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
