{{- if .Values.networkPolicy.enabled }}
# The API only accepts traffic from the two frontends: it is never exposed outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wishlist.fullname" . }}-api
  labels:
    {{- include "wishlist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wishlist.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "web-app" "web-public" }}
        - podSelector:
            matchLabels:
              {{- include "wishlist.selectorLabels" (dict "root" $ "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: http
    {{- include "wishlist.metricsIngressRule" . | trim | nindent 4 }}
---
# The worker serves no traffic: only its own probes, which the kubelet sends and NetworkPolicies do
# not filter, and its metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wishlist.fullname" . }}-worker
  labels:
    {{- include "wishlist.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wishlist.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  {{- with include "wishlist.metricsIngressRule" . | trim }}
  ingress:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
