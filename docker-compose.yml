# Local development services: pnpm dev runs the apps on the host, against these containers.
# Credentials here are local-only defaults; real ones come from Kubernetes Secrets.
services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: wishalia
      POSTGRES_PASSWORD: wishalia
      POSTGRES_DB: wishalia
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishalia"]
      interval: 5s
      retries: 10

  # Garage, the S3 bucket of the images, as in the chart (images.garage): one node, the bucket and
  # its key made at start. MinIO no longer publishes its community image.
  garage:
    image: dxflrs/garage:v2.6.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_BUCKET: wishalia
      # Local-only values, in Garage's format (the same as .env.example)
      GARAGE_DEFAULT_ACCESS_KEY: GK6c6f63616c2d6f6e6c792d6b65792121
      GARAGE_DEFAULT_SECRET_KEY: 6c6f63616c2d6f6e6c792d6761726167652d7365637265742d6368616e676521
      GARAGE_RPC_SECRET: 6c6f63616c2d6f6e6c792d6761726167652d7270632d7365637265742d636867
    configs:
      - source: garage
        target: /etc/garage.toml
    ports: ["9000:3900"]
    volumes: [garage:/var/lib/garage]

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4.0.25
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://garage:3900
      IMGPROXY_ALLOWED_SOURCES: s3://wishalia/
      AWS_ACCESS_KEY_ID: GK6c6f63616c2d6f6e6c792d6b65792121
      AWS_SECRET_ACCESS_KEY: 6c6f63616c2d6f6e6c792d6761726167652d7365637265742d6368616e676521
      # Signed paths only, as in production: the same local key and salt as .env.example
      IMGPROXY_KEY: 6c6f63616c2d6f6e6c792d696d6770726f78792d6b65792d6368616e67652d6d65
      IMGPROXY_SALT: 6c6f63616c2d6f6e6c792d696d6770726f78792d73616c742d6368616e67652d
    ports: ["8081:8080"]
    depends_on: [garage]

volumes:
  postgres:
  garage:

configs:
  garage:
    # IPv4: Docker networks often have no IPv6
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "0.0.0.0:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "0.0.0.0:3900"
