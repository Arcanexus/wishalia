# Local development services: pnpm dev runs the apps on the host, against these containers.
# Credentials here are local-only defaults; real ones come from Kubernetes Secrets.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: wishlist
      POSTGRES_DB: wishlist
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wishlist
      MINIO_ROOT_PASSWORD: change-me-locally
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: wishlist
      AWS_SECRET_ACCESS_KEY: change-me-locally
      # Local only: production signs every URL (IMGPROXY_KEY / IMGPROXY_SALT from a Secret)
      IMGPROXY_ALLOW_INSECURE: "true"
    ports: ["8081:8080"]
    depends_on: [minio]

volumes:
  postgres:
  minio:
