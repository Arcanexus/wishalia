<!doctype html>
<html lang="fr" class="a-no-js">
<!-- What amazon.fr answers a client it takes for a robot: a CAPTCHA, not the product. -->
<head>
<meta charset="utf-8">
<title dir="ltr">Amazon.fr</title>
<link rel="stylesheet" href="https://images-na.ssl-images-amazon.com/images/G/01/AUIClients/AmazonUI-3c913031596ca78a3768f4e934b1cc02ce238101.secure.min._V1_.css">
</head>
<body>
<div class="a-container a-padding-double-large" style="min-width:350px;padding:44px 0 !important">
  <div class="a-row a-spacing-double-large" style="width: 350px; margin: 0 auto">
    <div class="a-row a-spacing-medium a-text-center"><i class="a-icon a-logo"></i></div>
    <div class="a-box a-alert a-alert-info a-spacing-base">
      <div class="a-box-inner">
        <h4>Cliquez sur le bouton ci-dessous pour continuer vos achats</h4>
      </div>
    </div>
    <form method="get" action="/errors/validateCaptcha" name="">
      <input type=hidden name="amzn" value="AbCdEf0123456789==" /><input type=hidden name="amzn-r" value="&#047;dp&#047;B0BSHF7WHW" />
      <input type=hidden name="field-keywords" value="ABCDEF" />
      <button type="submit" class="a-button-text" alt="Continuer les achats">Continuer les achats</button>
    </form>
  </div>
  <div class="a-text-center a-spacing-small a-size-mini">
    <a href="https://www.amazon.fr/gp/help/customer/display.html/ref=footer_cou?ie=UTF8&nodeId=548524">Conditions générales de vente</a>
  </div>
</div>
</body>
</html>
