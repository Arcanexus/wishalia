packages:
  - apps/*
  - packages/*

# Only these packages may run install scripts (supply chain: nothing else executes on install)
onlyBuiltDependencies:
  - esbuild

# pnpm deploy (Docker images) copies the built workspace packages an app depends on into its
# node_modules. Legacy mode: no injected copies in development, where the packages stay symlinked
# and a rebuild is seen at once.
forceLegacyDeploy: true

# Optional peers (better-auth lists every framework and adapter it supports) stay out unless a
# package asks for them: otherwise the API image would carry SvelteKit, Vite and drizzle-kit.
autoInstallPeers: false
resolvePeersFromWorkspaceRoot: false
