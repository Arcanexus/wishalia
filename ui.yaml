---
# Source: wishalia/templates/garage-ui.yaml
# Garage UI (github.com/Noooste/garage-ui): a web console for the chart's Garage (the bucket of the
# images, its keys, the node). It holds the Garage admin token: sign-in with the token itself, or
# with your OIDC provider.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-wishalia-garage-ui
  labels:
    helm.sh/chart: wishalia-0.0.3
    app.kubernetes.io/name: wishalia
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.0.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: garage-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wishalia
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: garage-ui
  template:
    metadata:
      labels:
        helm.sh/chart: wishalia-0.0.3
        app.kubernetes.io/name: wishalia
        app.kubernetes.io/instance: t
        app.kubernetes.io/version: "0.0.3"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: wishalia
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: garage-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage-ui
          image: "noooste/garage-ui:v0.14.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GARAGE_UI_SERVER_HOST
              value: "0.0.0.0"
            - name: GARAGE_UI_SERVER_PORT
              value: "8080"
            - name: GARAGE_UI_SERVER_ENVIRONMENT
              value: production
            - name: GARAGE_UI_SERVER_ROOT_URL
              value: "https://garage.example.com"
            - name: GARAGE_UI_GARAGE_ENDPOINT
              value: "http://t-wishalia-garage:3900"
            - name: GARAGE_UI_GARAGE_ADMIN_ENDPOINT
              value: "http://t-wishalia-garage:3903"
            - name: GARAGE_UI_GARAGE_REGION
              value: "us-east-1"
            - name: GARAGE_UI_GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: s
                  key: GARAGE_ADMIN_TOKEN
            # Same origin only: the console calls its own host
            - name: GARAGE_UI_CORS_ENABLED
              value: "false"
            # Its signing key, made at the first start; a restart signs everyone out
            - name: GARAGE_UI_AUTH_JWT_PRIVATE_KEY_PATH
              value: /app/data/jwt-key.pem
            - name: GARAGE_UI_AUTH_OIDC_ENABLED
              value: "true"
            - name: GARAGE_UI_AUTH_OIDC_PROVIDER_NAME
              value: "SSO"
            - name: GARAGE_UI_AUTH_OIDC_ISSUER_URL
              value: "https://idp.example.com/"
            - name: GARAGE_UI_AUTH_OIDC_CLIENT_ID
              value: "g"
            - name: GARAGE_UI_AUTH_OIDC_SCOPES
              value: "openid,profile,email"
            - name: GARAGE_UI_AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: s
                  key: GARAGE_UI_OIDC_CLIENT_SECRET
            - name: GARAGE_UI_AUTH_OIDC_COOKIE_SECURE
              value: "true"
            # Your own settings of garage-ui (GARAGE_UI_*), e.g. who may sign in with OIDC
            - name: GARAGE_UI_AUTH_OIDC_ADMIN_ROLES
              value: "admins"
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            # The root filesystem is read-only
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
# Source: wishalia/templates/garage-ui.yaml
# Its own host, with the ingress settings of the chart (ingress.className, ingress.annotations)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t-wishalia-garage-ui
  labels:
    helm.sh/chart: wishalia-0.0.3
    app.kubernetes.io/name: wishalia
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "0.0.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: garage-ui
spec:
  rules:
    - host: "garage.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t-wishalia-garage-ui
                port:
                  name: http
