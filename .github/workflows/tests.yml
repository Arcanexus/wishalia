name: Tests

# Runs on its own (status badge, coverage badge) and is also called by docker-publish.yml
# so that the images are only built when the tests pass.
on:
  push:
    branches: ["main"]
    # The coverage badge commit changes only this file: no run for it
    paths-ignore: [".github/badges/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable pnpm
        # Node.js 25 and later no longer ship Corepack: the same version as the Dockerfile, from npm
        run: npm install -g corepack@0.36.0 && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage
        # Fails under the thresholds of vitest.config.ts
        run: pnpm coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct} % | ${t[k].covered}/${t[k].total} |`);
              console.log(["## Test coverage", "", "| | Coverage | Covered |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      - name: Coverage badge data
        run: |
          node -e '
            const rate = require("./coverage/coverage-summary.json").total.lines.pct;
            const color = rate >= 90 ? "brightgreen" : rate >= 80 ? "green" : rate >= 70 ? "yellow" : "red";
            require("fs").writeFileSync("coverage-badge.json", JSON.stringify({ schemaVersion: 1, label: "coverage", message: `${Math.round(rate)}%`, color }));
          '
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.json

  # Commits the coverage badge data to main (.github/badges/coverage.json), read by the README
  # badge through shields.io. Only commits when the value changes. Pushes made with GITHUB_TOKEN
  # never trigger workflows, so this cannot loop.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Tests'
    needs: node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
      - name: Commit badge to main
        run: |
          mkdir -p .github/badges
          mv coverage-badge.json .github/badges/coverage.json
          if git diff --quiet -- .github/badges/coverage.json && git ls-files --error-unmatch .github/badges/coverage.json >/dev/null 2>&1; then
            echo "Coverage unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -q -m "Update coverage badge"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Lint chart
        run: |
          helm lint charts/wishalia
          helm lint charts/wishalia --set ingress.enabled=true --set migrations.enabled=true \
            --set existingSecret=wishalia-secrets --set 'ingress.tls[0].secretName=wishalia-tls'
      - name: The chart needs a database, its own or yours
        run: |
          helm lint charts/wishalia --set postgresql.enabled=false --set existingSecret=s
          if helm template t charts/wishalia --set postgresql.enabled=false; then
            echo "::error::the chart rendered without any database"
            exit 1
          fi
          if helm template t charts/wishalia --set externalDatabase.existingSecret=db; then
            echo "::error::the chart rendered with two databases"
            exit 1
          fi
          # Built-in: a StatefulSet, the migrations in the API pods (no hook Job), a URL without password
          own=$(helm template t charts/wishalia)
          echo "$own" | yq -e 'select(.kind == "StatefulSet") | .metadata.name == "t-wishalia-postgresql"' > /dev/null
          if echo "$own" | yq -e 'select(.kind == "Job")' > /dev/null 2>&1; then
            echo "::error::the migration Job runs before the built-in PostgreSQL exists"
            exit 1
          fi
          api='select(.kind == "Deployment" and .metadata.name == "t-wishalia-api") | .spec.template.spec'
          echo "$own" | yq -e "$api | .initContainers[0].name == \"migrations\"" > /dev/null
          echo "$own" | yq -e "$api | .containers[0].env[] | select(.name == \"DATABASE_URL\") | .value == \"postgres://wishalia@t-wishalia-postgresql:5432/wishalia\"" > /dev/null
          echo "$own" | yq -e 'select(.kind == "NetworkPolicy" and .metadata.name == "t-wishalia-postgresql") | .spec.ingress[0].from | length == 2' > /dev/null
          # An existing claim: mounted, and no claim made
          claim=$(helm template t charts/wishalia --set postgresql.persistence.existingClaim=pgdata --show-only templates/postgresql.yaml)
          echo "$claim" | yq -e 'select(.kind == "StatefulSet") | .spec.template.spec.volumes[] | select(.name == "data") | .persistentVolumeClaim.claimName == "pgdata"' > /dev/null
          echo "$claim" | yq -e 'select(.kind == "StatefulSet") | .spec.volumeClaimTemplates == null' > /dev/null
          # The worker's sweep of the unused image files: on by default, and its settings pass through
          helm template t charts/wishalia --set images.enabled=true --set existingSecret=s --show-only templates/configmap.yaml \
            | yq -e '.data.IMAGE_CLEANUP_INTERVAL_HOURS == "6" and .data.IMAGE_CLEANUP_GRACE_HOURS == "24"' > /dev/null
          helm template t charts/wishalia --set images.enabled=true --set existingSecret=s --set images.cleanup.intervalHours=0 --show-only templates/configmap.yaml \
            | yq -e '.data.IMAGE_CLEANUP_INTERVAL_HOURS == "0"' > /dev/null
          # Garage as the images' bucket: the endpoint points at it, and it needs S3 with no endpoint of yours
          garage="--set images.enabled=true --set existingSecret=s --set images.storage=s3 --set images.garage.enabled=true"
          helm template t charts/wishalia $garage --show-only templates/configmap.yaml \
            | yq -e '.data.S3_ENDPOINT == "http://t-wishalia-garage:3900"' > /dev/null
          helm template t charts/wishalia $garage --show-only templates/garage.yaml \
            | yq -e 'select(.kind == "NetworkPolicy") | .spec.ingress[0].from | length == 3' > /dev/null
          # A slow /health (metadata on NFS) must never restart Garage: liveness is the S3 port
          sts=$(helm template t charts/wishalia $garage --show-only templates/garage.yaml | yq 'select(.kind == "StatefulSet") | .spec.template.spec.containers[0]')
          echo "$sts" | yq -e '.livenessProbe.tcpSocket.port == "s3"' > /dev/null
          echo "$sts" | yq -e '.readinessProbe.timeoutSeconds >= 5 and .startupProbe.timeoutSeconds >= 5 and .readinessProbe.periodSeconds * .readinessProbe.failureThreshold >= 120' > /dev/null
          for bad in "--set images.storage=volume" "--set images.s3.endpoint=http://s3.example.com"; do
            if helm template t charts/wishalia $garage $bad > /dev/null 2>&1; then
              echo "::error::the chart rendered Garage with $bad"
              exit 1
            fi
          done
          # Yours: the hook Job, DATABASE_URL from its Secret, no PostgreSQL
          yours=$(helm template t charts/wishalia --set postgresql.enabled=false --set externalDatabase.existingSecret=db)
          echo "$yours" | yq -e 'select(.kind == "Job") | .spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name == "db"' > /dev/null
          if echo "$yours" | yq -e 'select(.kind == "StatefulSet")' > /dev/null 2>&1; then
            echo "::error::the chart deployed PostgreSQL next to an existing database"
            exit 1
          fi
      - name: The Garage console, optional
        run: |
          g="--set images.enabled=true --set existingSecret=s --set images.storage=s3 --set images.garage.enabled=true"
          if helm template t charts/wishalia $g | grep -q garage-ui; then
            echo "::error::the Garage console rendered while images.garage.ui.enabled is off"
            exit 1
          fi
          ui="$g --set images.garage.ui.enabled=true"
          # Garage gets its admin token, its Service the admin port, its NetworkPolicy the console
          helm template t charts/wishalia $ui --show-only templates/garage.yaml > garage.yaml
          yq -e 'select(.kind == "StatefulSet") | .spec.template.spec.containers[0].env[] | select(.name == "GARAGE_ADMIN_TOKEN") | .valueFrom.secretKeyRef.key == "GARAGE_ADMIN_TOKEN"' garage.yaml > /dev/null
          yq -e 'select(.kind == "Service") | .spec.ports[] | select(.name == "admin") | .port == 3903' garage.yaml > /dev/null
          yq -e 'select(.kind == "NetworkPolicy") | .spec.ingress[1].from[0].podSelector.matchLabels."app.kubernetes.io/component" == "garage-ui"' garage.yaml > /dev/null
          # Without OIDC: token sign-in, no ingress without a host
          helm template t charts/wishalia $ui --show-only templates/garage-ui.yaml > ui.yaml
          yq -e 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "GARAGE_UI_AUTH_TOKEN_ENABLED") | .value == "true"' ui.yaml > /dev/null
          if yq -e 'select(.kind == "Ingress")' ui.yaml > /dev/null 2>&1; then
            echo "::error::the Garage console got an ingress without a host"
            exit 1
          fi
          # With OIDC and a host: its own Ingress, the secret from existingSecret, no token sign-in
          oidc="$ui --set images.garage.ui.host=garage.example.com --set images.garage.ui.oidc.enabled=true --set images.garage.ui.oidc.issuer=https://idp.example.com/ --set images.garage.ui.oidc.clientId=g --set images.garage.ui.env.GARAGE_UI_AUTH_OIDC_ADMIN_ROLES=admins"
          helm template t charts/wishalia $oidc --show-only templates/garage-ui.yaml > ui.yaml
          yq -e 'select(.kind == "Ingress") | .spec.rules[0].host == "garage.example.com"' ui.yaml > /dev/null
          yq -e 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "GARAGE_UI_AUTH_OIDC_CLIENT_SECRET") | .valueFrom.secretKeyRef.key == "GARAGE_UI_OIDC_CLIENT_SECRET"' ui.yaml > /dev/null
          # Your own settings pass through (images.garage.ui.env)
          yq -e 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "GARAGE_UI_AUTH_OIDC_ADMIN_ROLES") | .value == "admins"' ui.yaml > /dev/null
          # Scopes by default (garage-ui does not start without), or once only from env
          yq -e 'select(.kind == "Deployment") | .spec.template.spec.containers[0].env[] | select(.name == "GARAGE_UI_AUTH_OIDC_SCOPES") | .value == "openid,profile,email"' ui.yaml > /dev/null
          n=$(helm template t charts/wishalia $oidc --set images.garage.ui.env.GARAGE_UI_AUTH_OIDC_SCOPES=openid --show-only templates/garage-ui.yaml | grep -c "name: GARAGE_UI_AUTH_OIDC_SCOPES")
          if [ "$n" != 1 ]; then
            echo "::error::GARAGE_UI_AUTH_OIDC_SCOPES rendered $n times when set in env"
            exit 1
          fi
          if helm template t charts/wishalia $oidc --set 'images.garage.ui.oidc.scopes=null' > /dev/null 2>&1; then
            echo "::error::the chart rendered the Garage console with OIDC and no scopes"
            exit 1
          fi
          if grep -q GARAGE_UI_AUTH_TOKEN_ENABLED ui.yaml; then
            echo "::error::token sign-in left on with OIDC"
            exit 1
          fi
          # Refused: without Garage, OIDC without a host, a host of Wishalia
          for bad in "--set images.garage.enabled=false --set images.storage=volume" \
                     "--set images.garage.ui.oidc.enabled=true --set images.garage.ui.oidc.issuer=https://idp/ --set images.garage.ui.oidc.clientId=g" \
                     "--set images.garage.ui.host=wishalia.example.com"; do
            if helm template t charts/wishalia $ui $bad > /dev/null 2>&1; then
              echo "::error::the chart rendered the Garage console with $bad"
              exit 1
            fi
          done

      - name: Volume permissions for drivers without fsGroup (NFS)
        run: |
          vp="--set volumePermissions.enabled=true --set images.enabled=true --set existingSecret=s"
          all=$(helm template t charts/wishalia $vp)
          init='.spec.template.spec.initContainers[0]'
          echo "$all" | yq -e "select(.kind == \"StatefulSet\" and .metadata.name == \"t-wishalia-postgresql\") | $init | .command[2] == \"*chown 70:70 /var/lib/postgresql\"" > /dev/null
          for app in api worker; do
            echo "$all" | yq -e "select(.kind == \"Deployment\" and .metadata.name == \"t-wishalia-$app\") | $init | .command[2] == \"*chown 10001:10001 /data/images\"" > /dev/null
          done
          # The API keeps its migrations, after the volume is fixed
          echo "$all" | yq -e 'select(.kind == "Deployment" and .metadata.name == "t-wishalia-api") | .spec.template.spec.initContainers[1].name == "migrations"' > /dev/null
          # Root with CHOWN only
          echo "$all" | yq -e "select(.kind == \"StatefulSet\" and .metadata.name == \"t-wishalia-postgresql\") | $init | .securityContext.capabilities | (.add[0] == \"CHOWN\" and (.add | length) == 1 and .drop[0] == \"ALL\")" > /dev/null
          # Off by default: no such init container anywhere
          if helm template t charts/wishalia --set images.enabled=true --set existingSecret=s | grep -q volume-permissions; then
            echo "::error::volume-permissions rendered while volumePermissions.enabled is off"
            exit 1
          fi

      - name: A new major version of the built-in PostgreSQL dumps and restores its data, once
        run: |
          sts='select(.kind == "StatefulSet" and .metadata.name == "t-wishalia-postgresql") | .spec.template.spec'
          pg=$(helm template t charts/wishalia --set existingSecret=s)
          echo "$pg" | yq -e "$sts | ([.initContainers[].name] | join(\",\")) == \"upgrade-dump,upgrade-restore\"" > /dev/null
          echo "$pg" | yq -e "$sts | .initContainers[0].image == \"docker.io/library/postgres:18-alpine\"" > /dev/null
          echo "$pg" | yq -e "$sts | .initContainers[1].image == .containers[0].image" > /dev/null
          echo "$pg" | yq -e "$sts | .initContainers[0].env[] | select(.name == \"TO_MAJOR\") | .value == \"19\"" > /dev/null
          # After volumePermissions, which gives the volume to the postgres user first
          helm template t charts/wishalia --set existingSecret=s --set volumePermissions.enabled=true \
            | yq -e "$sts | ([.initContainers[].name] | join(\",\")) == \"volume-permissions,upgrade-dump,upgrade-restore\"" > /dev/null
          # Nothing to upgrade: off, the same major version, or no volume
          for none in "--set postgresql.upgrade.enabled=false" "--set postgresql.image.tag=18.7-alpine" \
                      "--set postgresql.persistence.enabled=false"; do
            if helm template t charts/wishalia --set existingSecret=s $none | grep -q upgrade-dump; then
              echo "::error::the upgrade rendered with $none"
              exit 1
            fi
          done
          # A tag without its major version cannot be compared
          if helm template t charts/wishalia --set existingSecret=s --set postgresql.image.tag=latest > /dev/null 2>&1; then
            echo "::error::the chart rendered a PostgreSQL tag without its major version"
            exit 1
          fi

      - name: The two hosts must differ
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true --set hosts.app=wishalia.example.com; then
            echo "::error::the chart rendered with the same host for the public view and the management app"
            exit 1
          fi

      - name: The session cookie domain covers both hosts
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set auth.cookieDomain=other.example.com; then
            echo "::error::the chart rendered a cookie domain that does not contain the two hosts"
            exit 1
          fi
          helm template t charts/wishalia --set existingSecret=s --show-only templates/configmap.yaml \
            | grep -q 'COOKIE_DOMAIN: "wishalia.example.com"'

      - name: The images live on a volume or in a bucket
        run: |
          out=$(helm template t charts/wishalia --set existingSecret=s --set images.enabled=true)
          echo "$out" | grep -q 'kind: PersistentVolumeClaim'
          echo "$out" | grep -q 'value: "local:///"'
          if echo "$out" | grep -q 'AWS_ACCESS_KEY_ID'; then
            echo "::error::the volume mode still asks imgproxy for S3 credentials"
            exit 1
          fi
          out=$(helm template t charts/wishalia --set existingSecret=s --set images.enabled=true \
            --set images.persistence.existingClaim=photos)
          if echo "$out" | grep -q 'kind: PersistentVolumeClaim'; then
            echo "::error::the chart created a claim beside images.persistence.existingClaim"
            exit 1
          fi
          echo "$out" | grep -q 'claimName: photos'
          helm template t charts/wishalia --set existingSecret=s --set images.enabled=true \
            --set images.storage=s3 --set images.s3.endpoint=http://minio:9000 | grep -q 's3://wishalia/'
          if helm template t charts/wishalia --set existingSecret=s --set images.enabled=true --set images.storage=disk; then
            echo "::error::the chart rendered an unknown images.storage"
            exit 1
          fi

      - name: The metrics stay inside the cluster
        run: |
          out=$(helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true \
            --set metrics.serviceMonitor.enabled=true)
          if echo "$out" | yq 'select(.kind == "Ingress")' | grep -q metrics; then
            echo "::error::the ingress routes to the metrics port"
            exit 1
          fi
          echo "$out" | yq -e 'select(.kind == "ServiceMonitor") | .spec.endpoints[0].port == "metrics"' > /dev/null
          echo "$out" | yq -e 'select(.kind == "NetworkPolicy" and .metadata.name == "t-wishalia-worker") | .spec.ingress[0].ports[0].port == "metrics"' > /dev/null

      - name: The API v1 host only forwards /v1
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true \
            --set hosts.api=app.wishalia.example.com; then
            echo "::error::the chart let the API v1 share a frontend host"
            exit 1
          fi
          # One document at a time (--show-only), one comparison per yq call
          render="helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true"
          $render --show-only templates/ingress.yaml | yq -e '.spec.rules | length == 2' > /dev/null
          api="--set hosts.api=api.wishalia.example.com"
          rule='.spec.rules[] | select(.host == "api.wishalia.example.com") | .http.paths'
          $render $api --show-only templates/ingress.yaml | yq -e "($rule | length) == 1" > /dev/null
          $render $api --show-only templates/ingress.yaml | yq -e "$rule | .[0].path == \"/v1\"" > /dev/null
          $render $api --show-only templates/configmap.yaml \
            | yq -e '.data.API_ORIGIN == "https://api.wishalia.example.com"' > /dev/null

  # The upgrade of the built-in PostgreSQL, for real: data written by the previous major version,
  # the two init containers of the chart, then the new server, which must find it
  postgresql-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Dump with the old image, restore with the new one
        run: |
          helm template t charts/wishalia --set existingSecret=s --show-only templates/postgresql.yaml > pg.yaml
          sts='select(.kind == "StatefulSet") | .spec.template.spec'
          old=$(yq -r "$sts | .initContainers[0].image" pg.yaml)
          new=$(yq -r "$sts | .containers[0].image" pg.yaml)
          yq -r "$sts | .initContainers[0].command[2]" pg.yaml > dump.sh
          yq -r "$sts | .initContainers[1].command[2]" pg.yaml > restore.sh
          from=$(yq -r "$sts | .initContainers[0].env[] | select(.name == \"FROM_MAJOR\") | .value" pg.yaml)
          to=$(yq -r "$sts | .initContainers[0].env[] | select(.name == \"TO_MAJOR\") | .value" pg.yaml)
          # As in the pod: the postgres user, a read-only root, the socket and /tmp apart
          env="-e POSTGRES_USER=wishalia -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=wishalia -e FROM_MAJOR=$from -e TO_MAJOR=$to"
          run="--user 70:70 --read-only --tmpfs /tmp --tmpfs /var/run/postgresql:uid=70,gid=70 -v pgdata:/var/lib/postgresql -v $PWD:/s:ro"
          docker run --rm -v pgdata:/var/lib/postgresql --entrypoint chown "$old" 70:70 /var/lib/postgresql
          docker run -d --name before $env $run "$old"
          until docker exec before pg_isready -h 127.0.0.1 -U wishalia; do sleep 1; done
          docker exec before psql -U wishalia -d wishalia -v ON_ERROR_STOP=1 \
            -c "create table wishes (id uuid primary key default gen_random_uuid(), title text, data jsonb)" \
            -c "insert into wishes (title, data) values ('vélo', '{\"price\": 12900}')"
          docker stop before
          for step in "$old dump.sh" "$new restore.sh" "$old dump.sh" "$new restore.sh"; do
            set -- $step
            # Twice: the second time finds the new version and does nothing
            docker run --rm $env $run "$1" bash -c "$(cat "$2")"
          done
          docker run -d --name after $env $run "$new"
          until docker exec after pg_isready -h 127.0.0.1 -U wishalia; do sleep 1; done
          test "$(docker exec after psql -U wishalia -d wishalia -Atc "select title || ' ' || (data->>'price') from wishes")" = "vélo 12900"
          docker exec after psql -U wishalia -d wishalia -Atc "show server_version" | grep -q "^$to\."

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Every page of docs/ is in the wiki sidebar
        run: python .github/scripts/docs_to_wiki.py docs "$RUNNER_TEMP/wiki"
      - name: Versions of package.json and Chart.yaml agree
        # A release candidate of the current version: checks that package.json and Chart.yaml agree
        run: python .github/scripts/release.py "v$(node -p "require('./package.json').version")-rc.1" > /dev/null
