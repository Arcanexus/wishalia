name: Tests

# Runs on its own (status badge, coverage badge) and is also called by docker-publish.yml
# so that the images are only built when the tests pass.
on:
  push:
    branches: ["main"]
    # The coverage badge commit changes only this file: no run for it
    paths-ignore: [".github/badges/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable pnpm
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage
        # Fails under the thresholds of vitest.config.ts
        run: pnpm coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct} % | ${t[k].covered}/${t[k].total} |`);
              console.log(["## Test coverage", "", "| | Coverage | Covered |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      - name: Coverage badge data
        run: |
          node -e '
            const rate = require("./coverage/coverage-summary.json").total.lines.pct;
            const color = rate >= 90 ? "brightgreen" : rate >= 80 ? "green" : rate >= 70 ? "yellow" : "red";
            require("fs").writeFileSync("coverage-badge.json", JSON.stringify({ schemaVersion: 1, label: "coverage", message: `${Math.round(rate)}%`, color }));
          '
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.json

  # Commits the coverage badge data to main (.github/badges/coverage.json), read by the README
  # badge through shields.io. Only commits when the value changes. Pushes made with GITHUB_TOKEN
  # never trigger workflows, so this cannot loop.
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Tests'
    needs: node
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge
      - name: Commit badge to main
        run: |
          mkdir -p .github/badges
          mv coverage-badge.json .github/badges/coverage.json
          if git diff --quiet -- .github/badges/coverage.json && git ls-files --error-unmatch .github/badges/coverage.json >/dev/null 2>&1; then
            echo "Coverage unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -q -m "Update coverage badge"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint chart
        run: |
          helm lint charts/wishalia
          helm lint charts/wishalia --set ingress.enabled=true --set migrations.enabled=true \
            --set existingSecret=wishalia-secrets --set 'ingress.tls[0].secretName=wishalia-tls'
      - name: The migrations need the Secret
        run: |
          if helm template t charts/wishalia; then
            echo "::error::the chart rendered the migration Job without existingSecret"
            exit 1
          fi
          helm template t charts/wishalia --set migrations.enabled=false > /dev/null
      - name: The two hosts must differ
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true --set hosts.app=wishalia.example.com; then
            echo "::error::the chart rendered with the same host for the public view and the management app"
            exit 1
          fi

      - name: The session cookie domain covers both hosts
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set auth.cookieDomain=other.example.com; then
            echo "::error::the chart rendered a cookie domain that does not contain the two hosts"
            exit 1
          fi
          helm template t charts/wishalia --set existingSecret=s --show-only templates/configmap.yaml \
            | grep -q 'COOKIE_DOMAIN: "wishalia.example.com"'

      - name: The metrics stay inside the cluster
        run: |
          out=$(helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true \
            --set metrics.serviceMonitor.enabled=true)
          if echo "$out" | yq 'select(.kind == "Ingress")' | grep -q metrics; then
            echo "::error::the ingress routes to the metrics port"
            exit 1
          fi
          echo "$out" | yq -e 'select(.kind == "ServiceMonitor") | .spec.endpoints[0].port == "metrics"' > /dev/null
          echo "$out" | yq -e 'select(.kind == "NetworkPolicy" and .metadata.name == "t-wishalia-worker") | .spec.ingress[0].ports[0].port == "metrics"' > /dev/null

      - name: The API v1 host only forwards /v1
        run: |
          if helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true \
            --set hosts.api=app.wishalia.example.com; then
            echo "::error::the chart let the API v1 share a frontend host"
            exit 1
          fi
          # One document at a time (--show-only), one comparison per yq call
          render="helm template t charts/wishalia --set existingSecret=s --set ingress.enabled=true"
          $render --show-only templates/ingress.yaml | yq -e '.spec.rules | length == 2' > /dev/null
          api="--set hosts.api=api.wishalia.example.com"
          rule='.spec.rules[] | select(.host == "api.wishalia.example.com") | .http.paths'
          $render $api --show-only templates/ingress.yaml | yq -e "($rule | length) == 1" > /dev/null
          $render $api --show-only templates/ingress.yaml | yq -e "$rule | .[0].path == \"/v1\"" > /dev/null
          $render $api --show-only templates/configmap.yaml \
            | yq -e '.data.API_ORIGIN == "https://api.wishalia.example.com"' > /dev/null

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Every page of docs/ is in the wiki sidebar
        run: python .github/scripts/docs_to_wiki.py docs "$RUNNER_TEMP/wiki"
      - name: Versions of package.json and Chart.yaml agree
        # A release candidate of the current version: checks that package.json and Chart.yaml agree
        run: python .github/scripts/release.py "v$(node -p "require('./package.json').version")-rc.1" > /dev/null
