name: CodeQL

# Static analysis of the TypeScript code and of the workflows, on every PR and every week.
# Code scanning needs a public repository (or GitHub Code Security on a private one): the job is
# skipped while the repository is private.
on:
  push:
    branches: ["main"]
    paths-ignore: [".github/badges/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Job permissions replace the workflow ones: checkout needs contents, CodeQL needs actions
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
