name: Helm Publish

# Publishes the chart as an OCI artifact: oci://ghcr.io/arcanexus/charts/wishalia
# The chart version and appVersion are taken from the git tag (v1.2.3 -> 1.2.3).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Check the tag against the versions of the repository
        run: python3 .github/scripts/release.py "$GITHUB_REF_NAME" > /dev/null
      - name: Package and push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm lint charts/wishalia
          helm package charts/wishalia --version "$VERSION" --app-version "$VERSION" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/wishalia-${VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"
